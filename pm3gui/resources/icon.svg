<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2430"/>
      <stop offset="1" stop-color="#0d1218"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16c79a"/>
      <stop offset="1" stop-color="#0f8f72"/>
    </linearGradient>
  </defs>

  <!-- Fondo redondeado -->
  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#bg)"/>
  <rect x="8.5" y="8.5" width="239" height="239" rx="51.5" fill="none" stroke="#2b3443" stroke-width="1"/>

  <!-- Tarjeta inclinada -->
  <g transform="rotate(-18 128 136)">
    <rect x="56" y="104" width="128" height="86" rx="12" fill="url(#card)"/>
    <rect x="56" y="104" width="128" height="86" rx="12" fill="none" stroke="#0a0e13" stroke-opacity="0.25" stroke-width="2"/>
    <!-- Chip -->
    <rect x="70" y="122" width="26" height="20" rx="4" fill="#0a2b23"/>
    <path d="M70 132 h26 M83 122 v20" stroke="#16c79a" stroke-width="2" opacity="0.8"/>
    <!-- Banda -->
    <rect x="68" y="160" width="104" height="8" rx="4" fill="#0a2b23" opacity="0.55"/>
  </g>

  <!-- Ondas de contactless (RFID), emanando hacia la esquina superior derecha -->
  <g transform="translate(176 80)" fill="none" stroke="#5ff0cb" stroke-width="9" stroke-linecap="round">
    <path d="M0 26 a26 26 0 0 0 26 -26" opacity="1"/>
    <path d="M0 48 a48 48 0 0 0 48 -48" opacity="0.7"/>
    <path d="M0 70 a70 70 0 0 0 70 -70" opacity="0.4"/>
  </g>
</svg>
